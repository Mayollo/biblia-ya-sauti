<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Biblia ya Sauti</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="manifest" href="/manifest.json" /> <!-- Manifest for PWA -->
</head>
<body class="chapter-page">

<!-- TOP BAR -->
<header class="top-bar">
  <button class="menu-btn">
    <img src="menu-icon.png" alt="Menu" />
  </button>
  <h2 class="title">Neno Biblia ya Sauti</h2>
  <button class="notes-btn">Somo</button>
</header>

<main>
  <div class="book-list">
    <div class="testament-section">
      <h3>Agano la Kale</h3>
      <div class="old-testament-books"></div>
    </div>

    <div class="testament-section">
      <h3>Agano Jipya</h3>
      <div class="new-testament-books"></div>
    </div>
  </div>
</main>

<script src="script.js"></script>

<!-- Service Worker Registration Script -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then((registration) => {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch((error) => {
          console.error('Service Worker registration failed:', error);
        });
    });
  }
</script>

</body>
</html>
